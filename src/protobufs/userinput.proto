syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package ClientBuffers;

message UserMessage {
  repeated Instruction instruction = 1;
}

message Instruction {
  extensions 2 to max;
}

message Keystroke {
  optional bytes keys = 4;
}

message ResizeMessage {
  optional int32 width = 5;
  optional int32 height = 6;
  optional int32 xpixel = 7;
  optional int32 ypixel = 8;
}

/* Local terminal theme: default colours in XParseColor form
   ("rrrr/gggg/bbbb", empty when unknown) and the light/dark
   preference (0 unknown, 1 dark, 2 light). */
message ThemeMessage {
  optional string foreground = 7;
  optional string background = 8;
  optional int32 scheme = 9;
}

extend Instruction {
  optional Keystroke keystroke = 2;
  optional ResizeMessage resize = 3;
  optional ThemeMessage theme = 4;
}
