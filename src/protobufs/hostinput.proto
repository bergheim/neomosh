syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package HostBuffers;

message HostMessage {
  repeated Instruction instruction = 1;
}

message Instruction {
  extensions 2 to max;
}

message HostBytes {
  optional bytes hoststring = 4;
}

message ResizeMessage {
  optional int32 width = 5;
  optional int32 height = 6;
}

message EchoAck {
  optional uint64 echo_ack_num = 8;
}

message ImageChunk {
  optional uint32 image_id = 1; /* the server's internal id */
  optional uint64 offset = 2;
  optional bytes data = 3;
  optional uint64 total = 4;
  optional int32 format = 5;
  optional int32 width = 6;
  optional int32 height = 7;
  optional bool compressed = 8;
  optional bool remove = 9; /* true: forget image_id outright; every other field is unset */
}

extend Instruction {
  optional HostBytes hostbytes = 2;
  optional ResizeMessage resize = 3;
  optional EchoAck echoack = 7;
  optional ImageChunk imagechunk = 4;
}
